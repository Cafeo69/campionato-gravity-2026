<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Race 2026 - Official Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo-gravity.png" type="image/png">
    <style>
        :root {
            --accent-red: #e10600;
            --text-dark: #111111;
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: white; 
            overflow-x: hidden; 
        }

        /* --- SFONDO EROICO --- */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), url('img/landing-bg.png');
            background-size: cover;       
            background-position: center;  
            background-attachment: fixed;
            padding: 20px;
            position: relative;
        }

        /* Texture puntinata sopra lo sfondo */
        .hero-section::before {
            content: ""; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(0,0,0,0.3) 1px, transparent 1px);
            background-size: 4px 4px; opacity: 0.3; z-index: 0;
        }
        
        .hero-content { 
            position: relative; 
            z-index: 1; 
            width: 100%; 
            max-width: 1200px; 
        }

        /* --- LOGO PRINCIPALE --- */
        .main-logo { 
            width: 180px; 
            margin-bottom: 30px; 
            animation: fadeInDown 1s ease; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); 
        }
        
        /* --- TITOLI --- */
        h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 70px;
            text-transform: uppercase;
            line-height: 0.9;
            margin: 0 0 15px 0;
            letter-spacing: -2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: fadeInUp 1s ease 0.2s backwards;
        }
        
        h1 span { color: var(--accent-red); }

        p.subtitle {
            font-size: 20px; color: #ddd; 
            margin-bottom: 5px; 
            font-weight: 400;
            letter-spacing: 1px; text-transform: uppercase; 
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        /* Scritta "by USACLI" */
        p.by-line {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 3px; 
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease 0.5s backwards;
        }
        
        p.by-line span {
            color: var(--accent-red); 
            font-weight: 900;
            font-family: 'Archivo Black', sans-serif; 
        }

        /* --- BOTTONI --- */
        .cta-container {
            display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
            animation: fadeInUp 1s ease 0.6s backwards;
        }

        .btn {
            padding: 15px 40px;
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase; text-decoration: none; font-size: 16px;
            border: 2px solid var(--accent-red); color: white; transition: 0.3s;
            background-color: rgba(225, 6, 0, 0.1); 
            backdrop-filter: blur(5px);
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
        }

        .btn-primary { background-color: var(--accent-red); box-shadow: 0 5px 20px rgba(225, 6, 0, 0.4); }
        .btn-primary:hover { background-color: white; color: var(--accent-red); border-color: white; transform: translateY(-3px); }
        .btn-outline:hover { background-color: white; color: var(--accent-red); border-color: white; transform: translateY(-3px); }

        /* --- FOOTER LANDING --- */
        .sponsors-footer {
            position: absolute; bottom: 30px; 
            width: 100%; 
            display: flex; 
            flex-direction: column; /* Impila elementi verticalmente */
            justify-content: center;
            align-items: center;    
            gap: 15px;              
            z-index: 1;
            animation: fadeIn 1s ease 1s backwards;
        }

        /* Box effetto vetro per logo USACLI */
        .usacli-box {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .usacli-box:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .usacli-box img { height: 55px; display: block; }

        /* Stile firma sviluppatore (GRIGIO MINIMAL) */
        .landing-credits {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 9px; font-weight: 300;
            color: #999999; /* GRIGIO invece che bianco */
            font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px;
        }

        .landing-credits a {
            color: #bbbbbb; /* Nome leggermente più chiaro */
            text-decoration: none; font-weight: 600; transition: all 0.3s ease;
            display: flex; align-items: center;
        }

        .landing-credits svg { width: 10px; height: 10px; margin-top: -1px; fill: currentColor; }
        .landing-credits a:hover { color: var(--accent-red); opacity: 1; }

        /* --- ANIMAZIONI --- */
        @keyframes fadeInDown { from { opacity:0; transform: translateY(-30px); } to { opacity:1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:0.8; } }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            h1 { font-size: 42px; }
            p.subtitle { font-size: 16px; }
            .main-logo { width: 140px; }
            .btn { width: 100%; text-align: center; padding: 15px 20px; }
            .cta-container { flex-direction: column; width: 100%; max-width: 300px; gap: 15px; margin: 0 auto; }
            .usacli-box img { height: 40px; }
            .sponsors-footer { bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        
        <div class="hero-content">
            <img src="img/logo-gravity.png" alt="Gravity Logo" class="main-logo">
            
            <h1>Gravity<br><span>Race 2026</span></h1>
            
            <p class="subtitle">Il Campionato piú adrenalinico che stavi aspettando</p>
            <p class="by-line">by <span>Speeddownproject</span></p>

            <div class="cta-container">
                <a href="piloti.html" class="btn btn-primary">Scopri i Piloti</a>
                <a href="calendario.html" class="btn btn-outline">Calendario Gare</a>
            </div>
        </div>

        <div class="sponsors-footer">
            
            <div class="usacli-box">
                <img src="img/logo-usacli.png" alt="USAcli">
            </div>

            <div class="landing-credits">
                Created by <a href="mailto:giovanni.cafeo.gc@gmail.com">GIOVANNI CAFEO</a>
                <span class="separator">&bull;</span>
                <a href="https://www.instagram.com/giovannicafeoo" target="_blank" aria-label="Instagram">

            </div>

        </div>
    </div>

</body>
</html>
